<title>Talking Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone-sized column. A robot friend and speech bubble on top, a dark number screen, then big chunky 3D buttons. */
:root {
  --bg: #e9f1ff;
  --ink: #1b2a4a;
  --panel: #ffffff;
  --screen: #12233f;
  --screen-ink: #e8fff3;
  --screen-dim: #8fa6c9;
  --digit: #ffffff;
  --digit-edge: #b4c4e4;
  --digit-ink: #1b2a4a;
  --op: #ff8a3d;
  --op-edge: #c9601f;
  --op-ink: #2a1300;
  --eq: #2fbf71;
  --eq-edge: #1f8f52;
  --eq-ink: #04230f;
  --clr: #f2506e;
  --clr-edge: #b8304b;
  --clr-ink: #ffffff;
  --soft: #ffd84d;
  --soft-edge: #c9a21a;
  --soft-ink: #3a2e00;
  --bot: #5b8cff;
  --bot-edge: #3a63cc;
  --bubble: #ffffff;
  --line: #c9d6ef;
  --f-display: "Noto Sans Bengali", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1830;
    --ink: #e7eeff;
    --panel: #18264a;
    --screen: #08101f;
    --digit: #27396b;
    --digit-edge: #142047;
    --digit-ink: #f1f5ff;
    --bot: #7aa2ff;
    --bot-edge: #4b73d6;
    --bubble: #1c2c56;
    --line: #2b3d70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1830;
  --ink: #e7eeff;
  --panel: #18264a;
  --screen: #08101f;
  --digit: #27396b;
  --digit-edge: #142047;
  --digit-ink: #f1f5ff;
  --bot: #7aa2ff;
  --bot-edge: #4b73d6;
  --bubble: #1c2c56;
  --line: #2b3d70;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-display);
  padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.1; text-wrap: balance; min-width: 0; }
.tools { display: flex; gap: 8px; align-items: center; }
.seg { display: flex; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button {
  font: 700 14px/1 var(--f-display); border: 0; background: transparent; color: var(--ink);
  padding: 7px 12px; border-radius: 999px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--bot); color: #fff; }
.snd {
  width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel);
  color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0;
}
.snd[aria-pressed="false"] { opacity: .55; }
.snd svg { width: 20px; height: 20px; }

.talk { display: flex; align-items: flex-end; gap: 10px; }
.bot { flex: none; width: 76px; }
.bot .head {
  background: var(--bot); border-radius: 22px 22px 18px 18px; height: 62px; position: relative;
  box-shadow: 0 5px 0 var(--bot-edge);
}
.bot .head::before { /* antenna */
  content: ""; position: absolute; left: 50%; top: -12px; width: 4px; height: 12px; margin-left: -2px;
  background: var(--bot-edge); border-radius: 2px;
}
.bot .head::after {
  content: ""; position: absolute; left: 50%; top: -18px; width: 12px; height: 12px; margin-left: -6px;
  background: var(--soft); border-radius: 50%;
}
.eye {
  position: absolute; top: 15px; width: 14px; height: 16px; background: #fff; border-radius: 50%;
  animation: blink 4.5s infinite;
}
.eye::after { content: ""; position: absolute; width: 7px; height: 7px; background: #12233f; border-radius: 50%; left: 4px; top: 6px; }
.eye.l { left: 17px; } .eye.r { right: 17px; }
.mouth {
  position: absolute; left: 50%; bottom: 10px; width: 26px; height: 8px; margin-left: -13px;
  background: #12233f; border-radius: 0 0 14px 14px; transform-origin: top center;
}
.bot.talking .mouth { animation: yap .28s ease-in-out infinite alternate; }
@keyframes yap { from { transform: scaleY(.5); } to { transform: scaleY(1.9); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

.bubble {
  flex: 1; min-width: 0; background: var(--bubble); border: 2px solid var(--line); border-radius: 18px 18px 18px 4px;
  padding: 10px 14px; font-size: 18px; font-weight: 700; line-height: 1.25; min-height: 62px;
  display: flex; align-items: center; overflow-wrap: anywhere;
}
.vsel { width: 100%; font: 600 15px/1.4 var(--f-display); padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); }
.menu { display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 8px; }
.menu button { font: 700 18px/1.4 var(--f-display); text-align: left; padding: 12px 14px; border: 0; border-radius: 12px; background: var(--bubble); color: var(--ink); cursor: pointer; }
.menu button[aria-current="page"] { background: var(--bot); color: #fff; }
.lessons { display: flex; flex-direction: column; gap: 12px; }
.lesson-card { display: block; width: 100%; text-align: left; font: 600 16px/1.6 var(--f-display); background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: 0 4px 0 var(--line); cursor: pointer; }
.lesson-card h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; line-height: 1.5; }
.lesson-card p { margin: 0 0 6px; opacity: .85; }
.lesson-card .ex { font-size: 18px; font-weight: 700; color: var(--bot-edge); }
.menu-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 2px 8px; border-bottom: 2px solid var(--line); }
.menu-tools .seg { flex: 1; justify-content: center; }
.menu-tools .seg button { flex: 1; text-align: center; }
.menu-tools .snd { flex: none; }
.menu-tools .seg button { font: 700 15px/1 var(--f-display); padding: 9px 14px; background: transparent; color: var(--ink); text-align: center; }
.menu-tools .seg button[aria-pressed="true"] { background: var(--bot); color: #fff; }
.menu-tools .snd { padding: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--panel); font: inherit; text-align: center; }
.theme-toggle svg { width: 20px; height: 20px; }
.theme-toggle .ic-moon { display: none; }
:root[data-theme="dark"] .theme-toggle .ic-sun { display: none; }
:root[data-theme="dark"] .theme-toggle .ic-moon { display: block; }
.dots { min-height: 34px; gap: 4px; }
.fruit { font-size: 26px; line-height: 1; display: inline-block; animation: pop .3s ease-out both; }
.fruit.small { font-size: 18px; }
.fruit.grp-end { margin-right: 16px; }
/* Answer box: keeps its height and eases when the number gets bigger or smaller */
.screen { min-height: 158px; transition: min-height .3s cubic-bezier(.2, .8, .2, 1); }
.num { min-height: 60px; transition: font-size .3s cubic-bezier(.2, .8, .2, 1), line-height .3s ease; }
.num.bump { animation: numBump .22s ease-out; }
@keyframes numBump {
  from { transform: scale(.94); opacity: .6; }
  to   { transform: scale(1); opacity: 1; }
}
/* Monkey face instead of the robot */
.bot .head {
  background: #b98352; border-radius: 50% 50% 46% 46%; box-shadow: 0 5px 0 #7d5330;
}
.bot .head::before, .bot .head::after {
  content: ""; position: absolute; top: 9px; width: 22px; height: 22px; border-radius: 50%;
  background: #8e5b34; box-shadow: inset 0 0 0 4px #e7b98a;
}
.bot .head::before { left: -9px; top: 9px; }
.bot .head::after { right: -9px; left: auto; top: 9px; background: #8e5b34; }
.bot .muzzle {
  position: absolute; left: 50%; bottom: 4px; width: 38px; height: 24px; margin-left: -19px;
  background: #f0d3ab; border-radius: 50%;
}
.bot .nose {
  position: absolute; left: 50%; top: 35px; width: 10px; height: 6px; margin-left: -5px;
  background: #5a3a22; border-radius: 50%;
}
.bot .mouth { background: #5a3a22; bottom: 8px; width: 18px; height: 6px; margin-left: -9px; }
.bot .eye::after { background: #2a1b10; }
/* Monkey grins and shows teeth when there are more than 5 bananas */
.bot .mouth { transition: width .3s ease, height .3s ease, margin-left .3s ease, border-radius .3s ease; }
.bot.grin .mouth {
  width: 30px; height: 13px; margin-left: -15px; bottom: 7px;
  border-radius: 0 0 15px 15px; background: #5a3a22;
  box-shadow: inset 0 3px 0 #ffffff;
}
/* Embossed buttons: raised top edge, soft inner shading, pressed in when tapped */
.k:not(.op):not(.eq):not(.clr):not(.soft) {
  box-shadow: inset 0 2px 1px rgba(255, 255, 255, .75), inset 0 -3px 4px rgba(20, 30, 60, .12),
              0 5px 0 var(--digit-edge), 0 9px 16px rgba(30, 50, 100, .16);
}
.k.op { box-shadow: inset 0 2px 1px rgba(255, 255, 255, .55), inset 0 -3px 4px rgba(60, 20, 0, .2), 0 5px 0 var(--op-edge), 0 9px 16px rgba(30, 50, 100, .14); }
.k.eq { box-shadow: inset 0 2px 1px rgba(255, 255, 255, .5), inset 0 -3px 4px rgba(0, 40, 15, .2), 0 5px 0 var(--eq-edge), 0 9px 16px rgba(30, 50, 100, .14); }
.k.clr { box-shadow: inset 0 2px 1px rgba(255, 255, 255, .5), inset 0 -3px 4px rgba(60, 0, 10, .2), 0 5px 0 var(--clr-edge), 0 9px 16px rgba(30, 50, 100, .14); }
.k.soft { box-shadow: inset 0 2px 1px rgba(255, 255, 255, .6), inset 0 -3px 4px rgba(60, 40, 0, .18), 0 5px 0 var(--soft-edge), 0 9px 16px rgba(30, 50, 100, .14); }
.k:not(.op):not(.eq):not(.clr):not(.soft):active, .k:not(.op):not(.eq):not(.clr):not(.soft).down {
  box-shadow: inset 0 3px 5px rgba(20, 30, 60, .2), 0 1px 0 var(--digit-edge);
}
.k.op:active, .k.op.down, .k.eq:active, .k.eq.down, .k.clr:active, .k.clr.down, .k.soft:active, .k.soft.down {
  box-shadow: inset 0 3px 5px rgba(0, 0, 0, .22), 0 1px 0 rgba(0, 0, 0, .15);
}
.snd, .seg { box-shadow: inset 0 2px 1px rgba(255, 255, 255, .7), inset 0 -2px 3px rgba(20, 30, 60, .1), 0 4px 10px rgba(30, 50, 100, .12); }
/* Menu: each page gets an icon and a clean row */
.menu-wrap .menu > button {
  display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 16px;
  transition: transform .15s ease, background-color .2s ease;
}
.menu-wrap .menu > button:active { transform: scale(.98); }
.menu-wrap .menu > button::before {
  font-size: 20px; line-height: 1; width: 28px; text-align: center; flex: none;
}
#m-calc::before { content: '🧮'; }
#m-memory::before { content: '🧠'; }
#m-lesson::before { content: '📚'; }
#m-practice::before { content: '✏️'; }
#m-story::before { content: '📖'; }
.menu-wrap .menu > button[aria-current="page"] { box-shadow: 0 6px 16px rgba(60, 100, 220, .3); }
/* Home (calculator) page: fit the screen, no scrolling. Keys shrink to fit short phones. */
html.fit, html.fit body { overflow: hidden; height: 100dvh; min-height: 0; overscroll-behavior: none; }
html.fit body { padding-block: 10px 12px; }
html.fit #page-calc { height: 100%; gap: 8px; }
html.fit #page-calc .top, html.fit #page-calc .talk, html.fit #page-calc .note, html.fit #page-calc .vsel { flex: none; }
html.fit #page-calc .screen { flex: none; min-height: 0; padding-block: 8px 10px; }
html.fit #page-calc .num { min-height: 48px; }
html.fit #page-calc .dots { min-height: 30px; }
html.fit #page-calc .pad { flex: 1 1 0; min-height: 0; grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 8px; }
html.fit #page-calc .k { height: 100%; max-height: 64px; align-self: center; }
/* Small swap button on the sticker: shows that tapping changes the animal */
.bot { position: relative; }
.swap-btn {
  position: absolute; right: -4px; bottom: -6px; width: 20px; height: 20px; padding: 0; z-index: 3;
  display: grid; place-items: center; cursor: pointer;
  background: var(--soft); color: var(--soft-ink); border: 1.5px solid #fff; border-radius: 50%;
  box-shadow: 0 2px 0 var(--soft-edge), 0 4px 8px rgba(30, 50, 100, .2);
  transition: transform .12s ease, box-shadow .12s ease;
}
.swap-btn svg { width: 11px; height: 11px; transition: transform .35s ease; }
.swap-btn:active { transform: translateY(2px) scale(.94); box-shadow: 0 1px 0 var(--soft-edge); }
.swap-btn.spin svg { transform: rotate(180deg); }
/* Tap the monkey to meet other animals */
.bot { cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.bot .face-emoji { display: none; height: 62px; font-size: 56px; line-height: 62px; text-align: center; }
.bot.alt .head { display: none; }
.bot.alt .face-emoji { display: block; }
.bot.alt .face-emoji.pop { animation: facePop .35s cubic-bezier(.34, 1.5, .64, 1); }
.bot.alt.talking .face-emoji { animation: faceTalk .3s ease-in-out infinite alternate; }
@keyframes facePop { from { transform: scale(.3) rotate(-12deg); } to { transform: none; } }
@keyframes faceTalk { from { transform: translateY(0) scale(1); } to { transform: translateY(-4px) scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .bot.alt .face-emoji, .bot.alt.talking .face-emoji { animation: none; } }
.note { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink); opacity: .8; line-height: 1.3; }

.screen { background: var(--screen); color: var(--screen-ink); border-radius: 22px; padding: 12px 18px 14px; }
.expr { min-height: 24px; text-align: right; font-size: 18px; color: var(--screen-dim); font-weight: 500; overflow-wrap: anywhere; }
.num { text-align: right; font-weight: 800; font-size: 56px; line-height: 1.05; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.num.m { font-size: 42px; } .num.s { font-size: 30px; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; min-height: 14px; margin-top: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; display: block; animation: pop .25s ease-out both; }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.k {
  font: 800 28px/1 var(--f-display); height: 64px; min-width: 0; border: 0; border-radius: 18px; cursor: pointer;
  background: var(--digit); color: var(--digit-ink); box-shadow: 0 5px 0 var(--digit-edge);
  display: grid; place-items: center; padding: 0; touch-action: manipulation; user-select: none;
  transition: transform .06s, box-shadow .06s;
}
.k:active, .k.down { transform: translateY(4px); box-shadow: 0 1px 0 var(--digit-edge); }
.k.op { background: var(--op); color: var(--op-ink); box-shadow: 0 5px 0 var(--op-edge); }
.k.op:active, .k.op.down { box-shadow: 0 1px 0 var(--op-edge); }
.k.eq { background: var(--eq); color: var(--eq-ink); box-shadow: 0 5px 0 var(--eq-edge); }
.k.eq:active, .k.eq.down { box-shadow: 0 1px 0 var(--eq-edge); }
.k.clr { background: var(--clr); color: var(--clr-ink); box-shadow: 0 5px 0 var(--clr-edge); }
.k.clr:active, .k.clr.down { box-shadow: 0 1px 0 var(--clr-edge); }
.k.soft { background: var(--soft); color: var(--soft-ink); box-shadow: 0 5px 0 var(--soft-edge); }
.k.soft:active, .k.soft.down { box-shadow: 0 1px 0 var(--soft-edge); }
.k.wide { grid-column: span 2; }
.k svg { width: 28px; height: 28px; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }


/* Bangla script needs more vertical room for matras (vowel signs) and conjuncts */
html:lang(bn) .top h1,
html:lang(bn) .bubble,
html:lang(bn) .note,
html:lang(bn) .expr,
html:lang(bn) .seg button,
html:lang(bn) .k {
  line-height: 1.6;
  padding-top: 2px;
  padding-bottom: 2px;
}
html:lang(bn) .top h1 { font-size: 22px; }
html:lang(bn) .bubble { font-size: 19px; }

@media (prefers-reduced-motion: reduce) {
  .eye, .bot.talking .mouth, .dots i, .fruit, .num.bump { animation: none; }
  .k { transition: none; }
}
</style>

  <div class="top">
    <h1 id="title">কথা বলা ক্যালকুলেটর</h1>
    <div class="tools">
      <button class="snd theme-toggle" type="button" aria-label="Dark or light">

    },
    en: {
      title: 'Talking Calculator',
      ops: { '+': 'plus', '−': 'minus', '×': 'times', '÷': 'divided by' },
      eq: 'equals', point: 'point', minus: 'minus', zero: 'zero',
      hello: 'Press a number!',
      divzero: "You can't divide by zero. Try again!",
      big: 'Wow, that number is too big!',
      cleared: 'Cleared! Start fresh.',

    }

  var BN = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];

  try {

    if (saved.lang === 'en' || saved.lang === 'bn') S.lang = saved.lang;

    { bn: 'বাগানে ৪টা ফুল ফুটেছিল। আরও ৩টা ফুল ফুটল। এখন মোট কয়টা ফুল?', en: 'Four flowers bloomed in the garden. Three more flowers bloomed. How many flowers are there in total?', a: 7 },
    { bn: 'ঝুড়িতে ৬টা আম ছিল। মা ২টা আম নিয়ে গেলেন। ঝুড়িতে এখন কয়টা আম বাকি?', en: 'There were 6 mangoes in the basket. Mom took 2 mangoes. How many mangoes are left?', a: 4 },
    { bn: 'একটা দোকানে ৯টা বিস্কুট ছিল। ৩টা বিস্কুট বিক্রি হলো। কয়টা বিস্কুট বাকি?', en: 'The shop had 9 biscuits. 3 biscuits were sold. How many biscuits are left?', a: 6 },
    { bn: 'তিন বন্ধুর প্রত্যেকের কাছে ২টি করে বল আছে। তাদের মোট কয়টি বল?', en: 'Each of three friends has 2 balls. How many balls do they have in total?', a: 6 },
    { bn: 'পাখির বাসায় ৫টা ডিম ছিল। আরও ৫টা ডিম এলো। এখন মোট কয়টা ডিম?', en: 'The bird nest had 5 eggs. 5 more eggs came. How many eggs are there now?', a: 10 }
  ];
  var ST = { i: -1, ans: '', busy: false, timer: null, correct: 0, total: 0 };
  function sRender() {
    $('s-q').textContent = ST.i >= 0 ? '' : '';
    $('s-ans').textContent = ST.ans === '' ? '?' : toShown(ST.ans);
    $('s-score').textContent = T[S.lang].score + ': ' + toShown(String(ST.correct)) + ' / ' + toShown(String(ST.total));
  }
  function sSay(shown, spoken) {
    $('s-bubble').textContent = shown;
    if (!S.sound || !window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(spoken);
      u.lang = T[S.lang].locale;
      var v = findVoice(S.lang);
      if (v) u.voice = v;
      u.rate = 0.85; u.pitch = 1.0;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function sNext() {
    clearTimeout(ST.timer);
    // Random order: shuffle all stories, show each once, then reshuffle (never the same one twice in a row)
    if (!ST.bag || !ST.bag.length) {
      ST.bag = STORIES.map(function (_, k) { return k; });
      for (var k = ST.bag.length - 1; k > 0; k--) {
        var j = Math.floor(Math.random() * (k + 1)), tmp = ST.bag[k]; ST.bag[k] = ST.bag[j]; ST.bag[j] = tmp;
      }
      if (ST.bag.length > 1 && ST.bag[ST.bag.length - 1] === ST.i) { ST.bag.unshift(ST.bag.pop()); }
    }
    ST.i = ST.bag.pop();
    ST.ans = ''; ST.busy = false;
    sRender();
    sSay(STORIES[ST.i][S.lang], STORIES[ST.i][S.lang]);
  }
  function sRepeat() { if (ST.i >= 0) sSay(STORIES[ST.i][S.lang], STORIES[ST.i][S.lang]); }
  function sDigit(d) {
    if (ST.busy) return;
    if (ST.ans === '0') ST.ans = d;
    else if (ST.ans.length < 4) ST.ans += d;
    else return;
    sRender();
    sSay(toShown(d), toSpeech(d));
  }
  function sBack() { if (ST.busy) return; ST.ans = ST.ans.slice(0, -1); sRender(); }
  function sCheck() {
    if (ST.busy || ST.ans === '' || ST.i < 0) return;
    var t = T[S.lang], st = STORIES[ST.i];
    ST.busy = true; ST.total++;
    var ok = parseInt(ST.ans, 10) === st.a;
    if (ok) ST.correct++;
    var shown = ok ? t.right : t.wrong + toShown(String(st.a));
    var spoken = ok ? t.right : t.wrong + toSpeech(String(st.a));
    sRender();
    sSay(shown, spoken);
    ST.timer = setTimeout(sNext, ok ? 2400 : 3400);
  }
  function sPress(k) {
    if (k >= '0' && k <= '9') return sDigit(k);
    if (k === 'B') return sBack();
    if (k === '=') return sCheck();
    if (k === 'R') return sRepeat();
    if (k === 'N') return sNext();
  }
  $('spad').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-k]');
    if (b) press(b.getAttribute('data-k'));
  });

  /* ---------- remember the numbers 1-9 ---------- */
  var MEM = [
    { n: 1, e: '✏️', eBn: '☝️', bn: 'একটা আঙুল তোলো। এই তো এক!', en: 'One looks like a straight pencil.' },
    { n: 2, e: '🦢', eBn: '✌️', bn: 'দুটো আঙুল তোলো। এই তো দুই!', en: 'Two looks like a swan with a curved neck.' },
    { n: 3, e: '🌊', eBn: '🤟', bn: 'তিনটা আঙুল তোলো। এই তো তিন!', en: 'Three looks like two waves stacked.' },
    { n: 4, e: '🪑', eBn: '✌️✌️', bn: 'দুই হাতে দুটো করে আঙুল তোলো। এই তো চার!', en: 'Four looks like a chair you can sit on.' },
    { n: 5, e: '✋', eBn: '🖐️', bn: 'এক হাতের সব আঙুল তোলো। এই তো পাঁচ!', en: 'Five is a hand with five fingers.' },
    { n: 6, e: '🐍', eBn: '🖐️☝️', bn: 'এক হাতে পাঁচ আঙুল, আরেক হাতে এক আঙুল। মোট ছয়!', en: 'Six looks like a snake curled up.' },
    { n: 7, e: '🚩', eBn: '🖐️✌️', bn: 'এক হাতে পাঁচ আঙুল, আরেক হাতে দুই আঙুল। মোট সাত!', en: 'Seven looks like a flag on a pole.' },
    { n: 8, e: '⛄', eBn: '🖐️🤟', bn: 'এক হাতে পাঁচ আঙুল, আরেক হাতে তিন আঙুল। মোট আট!', en: 'Eight looks like a snowman, two balls stacked.' },
    { n: 9, e: '🍭', eBn: '🖐️🖖', bn: 'এক হাতে পাঁচ আঙুল, আরেক হাতে চার আঙুল। মোট নয়!', en: 'Nine looks like a lollipop, a round top and a stick.' }
  ];
  function renderMemory() {
    var box = $('memlist');
    if (!box) return;
    box.textContent = '';
    MEM.forEach(function (m) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lesson-card';
      var h = document.createElement('h2');
      h.textContent = toShown(String(m.n)) + '  ' + (S.lang === 'bn' && m.eBn ? m.eBn : m.e);
      var p = document.createElement('p');
      p.textContent = m[S.lang];
      btn.appendChild(h);
      btn.appendChild(p);
      btn.addEventListener('click', function () {
        var shown = toShown(String(m.n)) + ' — ' + m[S.lang];
        var spoken = toSpeech(String(m.n)) + '. ' + m[S.lang];
        $('m-bubble').textContent = shown;
        if (!S.sound || !window.speechSynthesis) return;
        try {
          speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(spoken);
          u.lang = T[S.lang].locale;
          var v = findVoice(S.lang);
          if (v) u.voice = v;
          u.rate = 0.8; u.pitch = 1.0;
          speechSynthesis.speak(u);
        } catch (e) {}
      });
      box.appendChild(btn);
    });
  }

  /* ---------- start: a worked example so the first screen shows what it does ---------- */
  if (window.speechSynthesis) {
    loadVoices();
    try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) { speechSynthesis.onvoiceschanged = loadVoices; }
  }
  applyLang();
  S.cur = '0'; S.fresh = false; S.expr = '';
  render();
  elBubble.textContent = T[S.lang].hello;
  S.lastShown = T[S.lang].hello;
  S.lastSpoken = T[S.lang].hello;
})();
</script>
