name: make-keystore
on: workflow_dispatch
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -keystore release.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KP" -keypass "$KP" \
            -dname "CN=Talking Calculator"
          base64 -w0 release.jks > release.b64
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: release.b64
          retention-days: 1
